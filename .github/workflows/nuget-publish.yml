name: Publish to NuGet

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/nuget-publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore src/TradierSDK.sln

      - name: Build
        run: dotnet build src/TradierSDK.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/Tradier/Tradier.csproj --configuration Release --no-build --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
